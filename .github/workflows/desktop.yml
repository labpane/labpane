name: Desktop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Example site in a desktop window on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: e2e/desktop/go.mod
          cache-dependency-path: e2e/desktop/go.sum

      - name: Install GTK, WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb imagemagick

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd example build

      - name: Open the example site with the system title bar
        shell: bash
        run: bash e2e/desktop/smoke.sh native

      - name: Open the example site with the workspace as the title bar
        shell: bash
        run: bash e2e/desktop/smoke.sh custom

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: desktop-smoke/
